name: Build check

# Verification only. It does NOT create releases and does NOT sign anything.
#
# It used to run `xcodegen generate` (overwriting the committed .xcodeproj with
# one built from project.yml, last updated in March), build UNSIGNED, and then
# upload that zip to the GitHub release for the tag. So every tag push quietly
# replaced a Developer ID-signed, notarized build with an unsigned one — which
# is why the Releases page served an ad-hoc binary with a broken signature and
# the wrong bundle identifier, and why it could never get calendar permission
# on another Mac.
#
# Releases are produced by Scripts/release.sh, which signs, notarizes, staples,
# builds the DMG and publishes. CI cannot do that: the Developer ID certificate
# is not here and should not be. All CI can usefully do is catch a build that
# does not compile on a clean machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create empty local config
        # Config/Local.xcconfig is gitignored (it holds signing identity and
        # OAuth credentials). The project references it, so CI needs a stub.
        run: |
          mkdir -p Config
          printf 'MARKETING_VERSION = 0.0.0\nCURRENT_PROJECT_VERSION = 1\n' > Config/Local.xcconfig

      - name: Build (Release, unsigned)
        # The COMMITTED project — no xcodegen. project.yml drifted months out of
        # date and regenerating from it tests a project nobody ships.
        run: |
          set -e
          xcodebuild \
            -project NotchSnap.xcodeproj \
            -scheme NotchSnap \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            build
