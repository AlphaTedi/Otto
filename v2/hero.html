<!-- ================= HERO (v2): icon, title, download — then a MacBook ================= -->
<section class="hero2" id="hero">
  <div class="hero2-copy">
    <img class="hero2-icon" src="assets/icons/otto-icon-512.png" alt="" width="76" height="76">
    <h1>Your day lives in the notch. <span class="dim">To-dos, notes and meetings, one hover away.</span></h1>
    <a class="btn btn-primary btn-lg" href="downloads/Otto.dmg">{{APPLE}}Download for Mac</a>
    <p class="hero2-meta"><span>Free</span><span>No account</span><span>macOS 13 or later</span></p>
  </div>

  <div class="mac-stage" id="mac-stage">
    <div class="mac" id="mac">
      <div class="mac-lid">
        <div class="mac-screen">
          <img class="wallpaper" src="assets/img/wallpaper.jpg" alt="" width="2880" height="1800" loading="eager">
          <div class="menubar" aria-hidden="true">
            <div class="left">{{APPLE_MENU}}<span class="app">Otto</span></div>
            <div class="clock"><span>Thu Oct 8</span><span>08:08</span></div>
          </div>
          <div class="hero-otto"><div id="hero-otto" data-open-on-view></div></div>
          <p class="mac-tip" id="hero-tip" aria-hidden="true"><b>It’s live. Try it.</b>Type a to-do and press <span>↩</span>. <span>Tab</span> switches list.</p>
        </div>
      </div>
      <div class="mac-base" aria-hidden="true"><i></i></div>
    </div>
  </div>
</section>
